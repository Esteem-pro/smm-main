<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SMM HUB — контент-центр</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="%23FF5A2D"/><text x="50" y="72" font-size="58" text-anchor="middle" fill="white" font-family="Arial" font-weight="900">S</text></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;900&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#141B17; --paper:#F1F3ED; --line:#E1E5DA; --mut:#6C7A70;
  --accent:#FF5A2D; --accent-d:#E64A20;
  --side:#0F1713; --side-t:#DCE7DE; --side-m:#83988B;
  --blue:#2E6BFF; --green:#0FA36B; --amber:#E8930C; --red:#E5484D;
  --purple:#8B5CF6;
  --sh-sm:0 1px 2px rgba(20,27,23,.06),0 1px 1px rgba(20,27,23,.04);
  --sh-md:0 12px 26px -10px rgba(20,27,23,.22);
  --r:14px;
  --st-pub:#0FA36B; --st-proc:#E8930C; --st-ready:#2E6BFF; --st-plan:#8B5CF6;
}
html,body{height:100%}
body{
  font:400 14px/1.5 'Golos Text',system-ui,sans-serif;color:var(--ink);
  background:var(--paper);
  background-image:radial-gradient(rgba(20,27,23,.08) 1px,transparent 1.3px);
  background-size:22px 22px;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(720px 440px at 90% -10%, rgba(255,90,45,.10), transparent 60%),
    radial-gradient(680px 440px at -8% 112%, rgba(46,107,255,.09), transparent 60%);
}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{height:10px;width:10px}
::-webkit-scrollbar-thumb{background:#CBD2C3;border-radius:99px;border:2px solid var(--paper)}
button{font-family:inherit}

.app{display:flex;min-height:100vh;position:relative;z-index:1}
.main{flex:1;min-width:0;padding:26px 30px 44px}

.side{width:262px;flex:0 0 262px;background:var(--side);color:var(--side-t);
  padding:22px 14px 18px;display:flex;flex-direction:column;gap:22px;
  position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px}
.logo{width:44px;height:44px;background:var(--accent);border-radius:13px;display:grid;place-items:center;
  font:900 21px 'Unbounded';color:#fff;transform:rotate(-4deg);
  box-shadow:0 8px 16px -6px rgba(255,90,45,.6);transition:transform .25s;flex-shrink:0}
.brand:hover .logo{transform:rotate(4deg) scale(1.05)}
.brand b{font:700 17px 'Unbounded';letter-spacing:.06em;display:block;color:#fff}
.brand span{font-size:10px;color:var(--side-m);text-transform:uppercase;letter-spacing:.18em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 11px;border:0;background:transparent;
  color:var(--side-m);font:500 13.5px 'Golos Text';border-radius:9px;cursor:pointer;text-align:left;transition:.18s;width:100%}
.nav button:hover{background:rgba(255,255,255,.07);color:var(--side-t);transform:translateX(2px)}
.nav button.on{background:rgba(255,90,45,.16);color:#fff}
.pulse{width:7px;height:7px;border-radius:50%;background:#3DDC84;margin-left:auto;flex:0 0 auto;
  box-shadow:0 0 0 0 rgba(61,220,132,.55);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
.sb h5{font:600 10.5px 'Golos Text';text-transform:uppercase;letter-spacing:.18em;color:var(--side-m);margin:0 8px 8px;display:flex;align-items:center;justify-content:space-between}
.sb{display:flex;flex-direction:column;gap:1px}
.srow{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;transition:.15s;color:var(--side-t);font-size:13px;background:transparent;
  width:100%;text-align:left;font-family:inherit;position:relative}
.srow:hover{background:rgba(255,255,255,.06)}
.srow.on{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18)}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.cnt{margin-left:auto;font:600 11px 'Golos Text';background:rgba(255,255,255,.09);
  padding:2px 8px;border-radius:99px;color:var(--side-t)}
.month-box{margin-top:auto;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);
  border-radius:13px;padding:13px 14px}
.month-box .live{display:flex;align-items:center;gap:8px;font:600 10.5px 'Golos Text';color:#8FE3B0;
  text-transform:uppercase;letter-spacing:.14em}
.month-box b{font:600 13.5px 'Unbounded';display:block;margin:8px 0 4px;color:#fff}
.month-box small{color:var(--side-m);font-size:11.5px;line-height:1.5;display:block}

.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.kicker{display:inline-flex;gap:9px;align-items:center;font:600 11px 'Golos Text';
  letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.kicker i{width:20px;height:3px;background:var(--accent);border-radius:2px;display:inline-block}
h1{font:900 clamp(25px,2.9vw,38px)/1.08 'Unbounded';margin-top:9px;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--accent)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:0 12px;height:42px;width:252px;transition:.2s;box-shadow:var(--sh-sm);color:var(--mut)}
.search:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,27,23,.08)}
.search input{border:0;outline:0;background:none;font:500 13.5px 'Golos Text';width:100%;color:var(--ink)}
.search .x{border:0;background:none;cursor:pointer;color:var(--mut);display:grid;place-items:center;padding:3px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;
  min-height:42px;align-items:center;box-shadow:var(--sh-sm)}
.seg button{border:0;background:transparent;font:600 12px 'Golos Text';color:var(--mut);
  padding:7px 11px;border-radius:8px;cursor:pointer;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font:700 13.5px 'Golos Text';
  border-radius:11px;padding:0 18px;height:42px;transition:.18s;white-space:nowrap}
.btn.pri{background:var(--accent);color:#fff;box-shadow:0 10px 20px -9px rgba(255,90,45,.75)}
.btn.pri:hover{background:var(--accent-d);transform:translateY(-2px)}
.btn.pri:disabled{opacity:.45;pointer-events:none}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:#FDE5E6;color:#C62A2F;height:38px;padding:0 14px}
.btn.danger:hover{background:#F9D2D4}
.btn.sm{height:34px;padding:0 12px;font-size:12px}
.btn.mini{height:28px;padding:0 10px;font-size:11px;border-radius:8px}

.stats{display:flex;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-sm);margin-bottom:22px;overflow:hidden;animation:rise .45s both}
.stat{flex:1;padding:15px 20px;border-right:1px solid var(--line);min-width:0}
.stat .lbl{font:600 10.5px 'Golos Text';text-transform:uppercase;letter-spacing:.15em;color:var(--mut)}
.stat .num{font:700 29px/1.2 'Unbounded';margin-top:3px}
.stat .sub{font-size:11.5px;color:var(--mut);margin-top:1px}
.ringbox{display:flex;align-items:center;gap:14px;padding:12px 22px}
.ringbox b{font:600 12.5px 'Unbounded'}
.ringbox small{color:var(--mut);font-size:11px;display:block;margin-top:2px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

.grid-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh-sm);animation:rise .45s both}
.grid-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.grid-head h3{font:700 15px 'Unbounded';display:flex;align-items:center;gap:8px}
.grid-head h3 span{font:500 12px 'Golos Text';color:var(--mut);text-transform:none;letter-spacing:0}
.grid-head .filter-chip{font:600 11px 'Golos Text';padding:4px 10px;background:rgba(46,107,255,.1);color:var(--blue);border-radius:99px;display:inline-flex;align-items:center;gap:6px}
.grid-head .filter-chip i{cursor:pointer;font-size:9px}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;overflow-x:auto}
.cal-day-name{text-align:center;font:600 10.5px 'Golos Text';text-transform:uppercase;letter-spacing:.12em;color:var(--mut);padding:6px 0}
.cal-day{background:#F7F8F2;border:1.5px solid var(--line);border-radius:12px;min-height:110px;padding:6px;display:flex;flex-direction:column;gap:4px;transition:.18s;position:relative;cursor:pointer}
.cal-day:hover{border-color:#C6CEBC}
.cal-day.today{background:#fff;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cal-day.over{outline:2px dashed var(--accent);outline-offset:-3px;background:#FFF3ED}
.cal-day.pad{background:transparent;border:1.5px dashed var(--line);cursor:default}
.cal-day .d-num{font:700 12px 'Unbounded';color:var(--ink);padding:2px 4px;display:flex;justify-content:space-between;align-items:center}
.cal-day .d-num.today-mark{color:var(--accent)}
.cal-day .add-btn{opacity:0;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;border:0;cursor:pointer;display:grid;place-items:center;font-size:10px;transition:.18s}
.cal-day:hover .add-btn{opacity:1}
.cal-day .add-btn:hover{background:var(--accent);transform:scale(1.1)}

.post-card{font:600 11px 'Golos Text';padding:6px 7px;border-radius:8px;cursor:grab;transition:.15s;border-left:3px solid;position:relative;line-height:1.25}
.post-card:active{cursor:grabbing}
.post-card:hover{transform:translateY(-1px);box-shadow:var(--sh-md);z-index:2}
.post-card.plan{background:rgba(139,92,246,.08);border-left-color:var(--st-plan);color:#5B3BB3}
.post-card.proc{background:rgba(232,147,12,.10);border-left-color:var(--st-proc);color:#9E5A00}
.post-card.ready{background:rgba(46,107,255,.09);border-left-color:var(--st-ready);color:#1E4FD6}
.post-card.pub{background:rgba(15,163,107,.09);border-left-color:var(--st-pub);color:#0A7A50}
.post-card .pc-rubric{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;opacity:.8;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-card .pc-desc{font-weight:600;font-size:11px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.post-card .pc-ico{position:absolute;top:4px;right:5px;font-size:9px;opacity:.7}
.post-card.dimmed{opacity:.25;filter:grayscale(70%)}

.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh-sm);animation:rise .45s both}
.panel h3{font:700 15px 'Unbounded';margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h3 small{font:500 11px 'Golos Text';color:var(--mut);text-transform:none;letter-spacing:0;font-weight:500}
.rubric-list{display:flex;flex-direction:column;gap:8px;margin-top:14px;max-height:calc(100vh - 280px);overflow-y:auto;padding-right:4px}
.rubric-item{background:#F7F8F2;border:1px solid var(--line);border-radius:11px;padding:11px 12px;cursor:pointer;transition:.15s}
.rubric-item:hover{border-color:#C6CEBC;background:#EEF0E7}
.rubric-item.on{background:rgba(255,90,45,.08);border-color:var(--accent)}
.rubric-item .ri-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.rubric-item .ri-name{font:600 12.5px 'Golos Text';flex:1;line-height:1.3}
.rubric-item .ri-count{font:700 11px 'Unbounded';background:#fff;border:1px solid var(--line);padding:3px 8px;border-radius:99px;color:var(--ink);flex-shrink:0;cursor:text}
.rubric-item .ri-count.complete{background:var(--green);color:#fff;border-color:var(--green)}
.rubric-item .ri-count input{width:32px;background:transparent;border:0;outline:0;text-align:center;font:700 11px 'Unbounded';color:inherit}
.ri-track{height:4px;background:#E1E5DA;border-radius:99px;overflow:hidden}
.ri-track i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s ease}
.ri-track.complete i{background:var(--green)}
.ri-actions{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}

/* table */
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);overflow:hidden;animation:rise .45s both}
.tbl-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tbl-head h3{font:700 16px 'Unbounded'}
.tbl-head small{font-size:12px;color:var(--mut);margin-top:2px;display:block}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mut);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
table.db{width:100%;border-collapse:collapse;font-size:12.5px}
table.db th{background:#F7F8F2;padding:10px 14px;text-align:left;font:600 10.5px 'Golos Text';text-transform:uppercase;letter-spacing:.1em;color:var(--mut);border-bottom:1px solid var(--line);white-space:nowrap}
table.db td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.4;color:var(--ink)}
table.db tr:last-child td{border-bottom:0}
table.db tr:hover td{background:#F7F8F2}
table.db .row-archived{opacity:.5}
table.db .row-new td{background:rgba(255,90,45,.03)}
table.db select{background:transparent;border:1px solid var(--line);border-radius:7px;padding:4px 8px;font:500 12px 'Golos Text';outline:none;color:var(--ink);cursor:pointer}
table.db .cell{min-width:80px;max-width:250px;padding:4px 8px;border-radius:6px;outline:none;word-wrap:break-word;white-space:pre-wrap;transition:.15s}
table.db .cell:focus{background:#fff;box-shadow:0 0 0 2px var(--accent)}
table.db .cell:empty:before{content:"—";color:#C6CEBC}
table.db .del-btn{color:var(--mut);background:transparent;border:0;cursor:pointer;padding:6px;border-radius:7px;transition:.15s}
table.db .del-btn:hover{background:#FDE5E6;color:var(--red)}

/* admin */
.admin-grid{display:grid;grid-template-columns:1fr 1.8fr;gap:20px;animation:rise .45s both}
.toggle{width:44px;height:24px;border-radius:99px;background:#D1D7CA;position:relative;cursor:pointer;transition:.2s;flex-shrink:0;border:0}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s;box-shadow:var(--sh-sm)}
.toggle.on::after{left:22px}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line);gap:12px}
.setting-row:last-child{border-bottom:0}
.setting-row .lbl{font:600 13px 'Golos Text';color:var(--ink)}
.setting-row .sub{font:500 11px 'Golos Text';color:var(--mut);margin-top:2px}
.num-input{width:72px;height:34px;background:#F7F8F2;border:1px solid var(--line);border-radius:9px;padding:0 10px;font:600 13px 'Golos Text';text-align:center;color:var(--ink);outline:none;font-family:inherit}
.num-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,90,45,.12)}

.logs-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px;flex-wrap:wrap}
.logs-head h4{font:700 14px 'Unbounded';display:flex;align-items:center;gap:8px}
.logs-head .cnt-badge{font:700 11px 'Golos Text';background:#F7F8F2;border:1px solid var(--line);padding:3px 10px;border-radius:99px;color:var(--ink)}
.log-group{background:#F7F8F2;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.log-group-head{padding:11px 14px;background:#EEF0E7;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;transition:.15s;gap:10px}
.log-group-head:hover{background:#E5E9DE}
.log-group-head b{font:600 13px 'Golos Text';flex:1}
.log-group-head i{color:var(--mut);font-size:10px;width:12px;text-align:center;transition:.2s}
.log-entry{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;position:relative}
.log-entry:hover{background:#fff}
.log-entry .log-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;flex-wrap:wrap}
.log-entry .log-desc{font-weight:600;color:var(--ink);flex:1}
.log-entry .log-dates{font:600 11px 'Golos Text';display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.log-entry .old{color:var(--mut);text-decoration:line-through}
.log-entry .new{color:var(--accent);font-weight:700}
.log-entry .reason{background:rgba(229,72,77,.08);color:#A8292D;padding:7px 11px;border-radius:8px;font-size:12px;font-style:italic;border-left:3px solid var(--red)}
.log-entry .foot{font:500 10.5px 'Golos Text';color:var(--mut);display:flex;justify-content:flex-end;gap:12px}
.log-entry .del-btn{position:absolute;top:10px;right:10px;background:transparent;border:0;color:var(--mut);cursor:pointer;padding:4px 6px;border-radius:6px;opacity:0;transition:.15s}
.log-entry:hover .del-btn{opacity:1}
.log-entry .del-btn:hover{background:#FDE5E6;color:var(--red)}

.log-group.red{background:#FDF5F4;border-color:#F5D5D0}
.log-group.red .log-group-head{background:#FBE6E2}
.log-group.red .log-group-head:hover{background:#F8D9D4}
.log-group.red .log-entry .reason{background:rgba(229,72,77,.12)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,19,.52);display:grid;place-items:center;
  z-index:50;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:16px;width:min(560px,100%);max-height:92vh;overflow:auto;
  padding:22px 24px;box-shadow:0 34px 70px -24px rgba(15,23,19,.5);
  animation:mpop .28s cubic-bezier(.2,.9,.3,1.15)}
@keyframes mpop{from{opacity:0;transform:translateY(18px) scale(.97)}}
.modal h3{font:700 16px 'Unbounded';margin-bottom:4px}
.modal .sub{font-size:12px;color:var(--mut);margin-bottom:14px}
.f label{display:block;font:600 10.5px 'Golos Text';text-transform:uppercase;letter-spacing:.14em;
  color:var(--mut);margin:14px 0 6px}
.f input[type=text],.f textarea,.f select,.f input[type=date],.f input[type=email],.f input[type=number]{width:100%;border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;font:500 14px 'Golos Text';color:var(--ink);background:#FAFBF7;
  outline:none;transition:.15s;font-family:inherit}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,27,23,.08)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel button{border:1.5px solid var(--line);background:#fff;color:var(--mut);font:600 12px 'Golos Text';
  padding:7px 13px;border-radius:99px;cursor:pointer;transition:.15s}
.chipsel button:hover{border-color:var(--ink);color:var(--ink)}
.chipsel button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chipsel button.on.warn{background:var(--red);border-color:var(--red)}
.chipsel button.on.blue{background:var(--blue);border-color:var(--blue)}
.mfoot{display:flex;gap:10px;margin-top:22px;align-items:center}

.dd{position:relative;margin-top:6px;background:#FAFBF7;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px;transition:.15s;cursor:text}
.dd:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,27,23,.08)}
.dd input{border:0;outline:0;background:transparent;width:100%;font:500 14px 'Golos Text';color:var(--ink)}
.dd-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh-md);max-height:240px;overflow-y:auto;z-index:20}
.dd-item{padding:9px 12px;font-size:13px;cursor:pointer;transition:.1s;border-bottom:1px solid var(--line)}
.dd-item:last-child{border-bottom:0}
.dd-item:hover{background:#F7F8F2;color:var(--accent)}
.dd-empty{padding:12px;text-align:center;color:var(--mut);font-size:12px}

.admin-form{display:flex;gap:8px;margin-top:10px}
.admin-form input{flex:1}

.admin-list{display:flex;flex-direction:column;gap:6px;margin-top:12px;max-height:260px;overflow-y:auto}
.admin-row{display:flex;justify-content:space-between;align-items:center;background:#F7F8F2;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px}
.admin-row .em{font:600 13px 'Golos Text';flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;
  gap:8px;z-index:60;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;font:600 12.5px 'Golos Text';padding:10px 18px;border-radius:99px;
  box-shadow:var(--sh-md);animation:tin .3s;display:flex;gap:9px;align-items:center}
.toast .tdot{width:8px;height:8px;border-radius:50%;background:#3DDC84;flex:0 0 auto}
.toast.err .tdot{background:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(14px)}}

.loader-wrap{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper);z-index:100;
  background-image:radial-gradient(rgba(20,27,23,.08) 1px,transparent 1.3px);background-size:22px 22px}
.loader{width:44px;height:44px;border:3px solid #E1E5DA;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.auth-card{background:#fff;border-radius:20px;padding:38px 30px;max-width:400px;width:100%;text-align:center;box-shadow:var(--sh-md);animation:mpop .4s}
.auth-card .logo-big{width:68px;height:68px;background:var(--accent);border-radius:18px;display:grid;place-items:center;font:900 32px 'Unbounded';color:#fff;margin:0 auto 18px;transform:rotate(-4deg);box-shadow:0 12px 24px -10px rgba(255,90,45,.5)}
.auth-card h2{font:800 22px 'Unbounded';margin-bottom:8px}
.auth-card p{font-size:13px;color:var(--mut);margin-bottom:22px}
.denied-card .logo-big{background:var(--red);box-shadow:0 12px 24px -10px rgba(229,72,77,.5)}

.soc-input{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:3px 6px;margin-left:4px}
.soc-input input{background:transparent;border:0;outline:0;color:#fff;font:500 12px 'Golos Text';width:80px}
.soc-input button{background:transparent;border:0;color:#8FE3B0;cursor:pointer;padding:2px 4px}
.soc-input .x{color:#ff9a90}

.add-soc-btn{background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.2);color:var(--side-m);padding:7px 10px;border-radius:9px;cursor:pointer;font:600 12px 'Golos Text';transition:.15s;width:100%}
.add-soc-btn:hover{background:rgba(255,255,255,.09);color:#fff}

.date-diff{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px;background:#F7F8F2;border-radius:11px;margin:14px 0;font:600 13px 'Golos Text'}
.date-diff .old{color:var(--mut);text-decoration:line-through}
.date-diff .arr{color:var(--mut);font-size:12px}
.date-diff .new{color:var(--accent);font:700 14px 'Unbounded'}

.warn-banner{background:rgba(229,72,77,.08);border:1px solid rgba(229,72,77,.25);color:#A8292D;padding:10px 14px;border-radius:11px;font-size:12.5px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.warn-banner i{flex-shrink:0;margin-top:2px}

.empty{text-align:center;padding:38px 20px;color:var(--mut)}
.empty i{font-size:34px;opacity:.3;margin-bottom:10px;display:block}
.empty p{font-size:13px}
.empty b{display:block;color:var(--ink);font:700 15px 'Unbounded';margin-bottom:4px}

@media(max-width:1100px){
  .side{width:220px;flex-basis:220px}
  .admin-grid{grid-template-columns:1fr}
}
@media(max-width:860px){
  .side{display:none}
  .main{padding:18px 14px 30px}
  .stats{flex-wrap:wrap}
  .stat{flex:1 1 45%;border-bottom:1px solid var(--line)}
  .ringbox{border-left:0}
  .cal-grid{grid-template-columns:repeat(7,minmax(110px,1fr));overflow-x:auto;padding-bottom:8px}
  .tools{width:100%}
  .search{flex:1;width:auto}
}
</style>

<body>
<div id="root"></div>

<script type="text/babel">
const {useState, useEffect, useMemo, useRef} = React;

const firebaseConfig = {
    apiKey: "AIzaSyDGPi5WmsDvBU0sq1y25YcYQI9aZb22MP8",
    authDomain: "esteem---marketing---smm-plan.firebaseapp.com",
    databaseURL: "https://esteem---marketing---smm-plan-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "esteem---marketing---smm-plan",
    storageBucket: "esteem---marketing---smm-plan.firebasestorage.app",
    messagingSenderId: "260291671274",
    appId: "1:260291671274:web:274759aa78910bec401393"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const RAW_RUBRICS_BASE = [
    "Тренд", "Салон авто: До/после наших ковриков", "Запросы клиентов", "Товар недели", 
    "Обучающий контент и советы", "Будни от лица Кая", "Обзор готовых изделий (на чистке)", 
    "Полный процесс производства ASMR", "Залипитальные видео ASMR", 
    "Сравнение нашей продукции с аналогами", "Подборки готовых решений и идей", 
    "ОЧЕНЬ Интересные факты", "Сммщица на производстве", "Коврики в салоне автомобиля", 
    "Аксессуары в реальной жизни", "Вирусный контент", "Новинки", 
    "Виртуальная примерка автоковров в салон", "Без слов и объяснений", "Сериал", 
    "Сторителлинг", "Обзор на популярные ролики", "Краштесты", "От эскиза до готового изделия", 
    "Аксессуары с животными", "Ответы на вопросы (с мастером)", "Новости из автосферы", 
    "Углубление в производство", "Полный путь заказа", "Рабочие будни", "Факапы", 
    "Метод бисоциации/сравнение", "Часто задаваемые вопросы и ответы на них", "Эстетика деталей", 
    "Отзывы клиентов", "Закулисье", "Поздравления с праздником", 
    "Обучающий контент и советы с Сашей", "Новинки и новости из автосферы", 
    "Интересные истории и факты", "Практика и эксплуатация", 
    "Кейсы клиентов РФ+Европа+Дубай", "ТОП 10", "Образовательные"
];

const MONTH_NAMES = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTH_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const STATUSES = {
    plan: {label:'Запланировано', icon:'fa-calendar-alt', color:'var(--st-plan)'},
    proc: {label:'В производстве', icon:'fa-video',       color:'var(--st-proc)'},
    ready:{label:'Ожидает',        icon:'fa-clock',       color:'var(--st-ready)'},
    pub:  {label:'Опубликовано',   icon:'fa-check-circle',color:'var(--st-pub)'},
};
const SOC_COLORS = {
    'Instagram':'#E1306C','Telegram':'#229ED9','YouTube':'#FF0000','TikTok':'#000000',
    'ВКонтакте':'#0077FF','Одноклассники':'#EE8208','Дзен':'#000000','Threads':'#000000','X':'#000000','Pinterest':'#E60023'
};
const getSocColor = name => SOC_COLORS[name] || '#FF5A2D';

const toArray = obj => Object.keys(obj || {}).map(k => ({...obj[k], id:k}));
const pad = n => String(n).padStart(2,'0');
const dateStr = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
const fmtDate = (d,m,y) => `${d} ${MONTH_GEN[m]} ${y}`;

function App(){
    const [user,setUser] = useState(null);
    const [authLoading,setAuthLoading] = useState(true);
    const [dataLoading,setDataLoading] = useState(true);
    const [accessDenied,setAccessDenied] = useState(false);

    const [activeTab,setActiveTab] = useState('calendar');
    const minDate = new Date(2026,7,1);
    const todayDate = new Date();
    const [currentDate,setCurrentDate] = useState(todayDate < minDate ? minDate : new Date(todayDate.getFullYear(),todayDate.getMonth(),1));
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    const [socials,setSocials] = useState([]);
    const [activeSocial,setActiveSocial] = useState(null);
    const [addingSocial,setAddingSocial] = useState(false);
    const [newSocialName,setNewSocialName] = useState('');

    const [rubricsBase,setRubricsBase] = useState([]);
    const [activeRubricFilter,setActiveRubricFilter] = useState(null);
    const [posts,setPosts] = useState([]);
    const [monthlyRubrics,setMonthlyRubrics] = useState([]);

    const [settings,setSettings] = useState({requireReason:true,gracePeriodMinutes:5,deleteRequireReason:true,deleteGracePeriodMinutes:5});
    const [admins,setAdmins] = useState([]);
    const [rescheduleLogs,setRescheduleLogs] = useState([]);
    const [deleteLogs,setDeleteLogs] = useState([]);
    const [newAdminEmail,setNewAdminEmail] = useState('');

    const [reschedulePrompt,setReschedulePrompt] = useState({open:false,post:null,oldDate:'',newDate:''});
    const [deletePrompt,setDeletePrompt] = useState({open:false,post:null});
    const [postModal,setPostModal] = useState({open:false,post:null,day:1});
    const [rubricModal,setRubricModal] = useState(false);
    const [copyModal,setCopyModal] = useState(false);

    const [postRubricSearch,setPostRubricSearch] = useState('');
    const [rubricSearch,setRubricSearch] = useState('');
    const [openDropdown,setOpenDropdown] = useState(null);

    const [collapsedLogs,setCollapsedLogs] = useState({});
    const [collapsedDelLogs,setCollapsedDelLogs] = useState({});

    const [dragOverDay,setDragOverDay] = useState(null);
    const [toasts,setToasts] = useState([]);

    const toast = (msg,err=false) => {
        const id = Date.now()+Math.random();
        setToasts(t=>[...t,{id,msg,err}]);
        setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),2800);
    };

    useEffect(()=>{
        const u = auth.onAuthStateChanged(u=>{setUser(u);setAuthLoading(false);});
        return ()=>u();
    },[]);

    useEffect(()=>{
        if(!user) return;
        setDataLoading(true);
        setAccessDenied(false);
        const ref = db.ref('shared_workspace');
        const onData = snap => {
            const d = snap.val()||{};
            if(!d.rubricsBase && !d.socials){
                const u = {};
                RAW_RUBRICS_BASE.forEach(name=>{
                    const k = db.ref().push().key;
                    u[`rubricsBase/${k}`] = {name,status:'active',goal:'',audience:'',funnel:'',format:'',examples:'',freq:'',benefit:'',why:''};
                });
                const sk = db.ref().push().key;
                u[`socials/${sk}`] = {name:'Instagram',year:2026,month:7};
                u.settings = {requireReason:true,gracePeriodMinutes:5,deleteRequireReason:true,deleteGracePeriodMinutes:5};
                ref.update(u).catch(err=>{if(err.code==='PERMISSION_DENIED')setAccessDenied(true);});
                return;
            }
            setSocials(toArray(d.socials));
            setRubricsBase(toArray(d.rubricsBase));
            setPosts(toArray(d.posts));
            setMonthlyRubrics(toArray(d.monthlyRubrics));
            setAdmins(toArray(d.admins));
            setRescheduleLogs(toArray(d.rescheduleLogs));
            setDeleteLogs(toArray(d.deleteLogs));
            const s = d.settings||{};
            setSettings({
                requireReason: s.requireReason!==undefined?s.requireReason:true,
                gracePeriodMinutes: s.gracePeriodMinutes!==undefined?Number(s.gracePeriodMinutes):5,
                deleteRequireReason: s.deleteRequireReason!==undefined?s.deleteRequireReason:true,
                deleteGracePeriodMinutes: s.deleteGracePeriodMinutes!==undefined?Number(s.deleteGracePeriodMinutes):5,
            });
            setDataLoading(false);
        };
        const onErr = err=>{
            if(err.code==='PERMISSION_DENIED'){setAccessDenied(true);setDataLoading(false);}
            else console.error(err);
        };
        ref.on('value',onData,onErr);
        return ()=>ref.off('value',onData);
    },[user]);

    useEffect(()=>{
        if(socials.length>0 && !socials.some(s=>s.name===activeSocial)) setActiveSocial(socials[0].name);
    },[socials,activeSocial]);

    const login = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>toast(e.message,true));
    const logout = () => auth.signOut();

    const isAdmin = user && (admins.length===0 || admins.some(a=>a.email.toLowerCase()===user.email.toLowerCase()));

    const monthPosts = useMemo(()=>posts.filter(p=>p.year===year && p.month===month && p.social===activeSocial),[posts,year,month,activeSocial]);
    const monthRubrics = useMemo(()=>monthlyRubrics.filter(r=>r.year===year && r.month===month && r.social===activeSocial),[monthlyRubrics,year,month,activeSocial]);
    const visibleSocials = socials.filter(s=>year>s.year || (year===s.year && month>=s.month));

    const stats = useMemo(()=>({
        total: monthPosts.length,
        plan: monthPosts.filter(p=>p.status==='plan').length,
        proc: monthPosts.filter(p=>p.status==='proc').length,
        ready: monthPosts.filter(p=>p.status==='ready').length,
        pub: monthPosts.filter(p=>p.status==='pub').length,
    }),[monthPosts]);

    const rubricStats = useMemo(()=>{
        return monthRubrics.map(r=>{
            const fact = monthPosts.filter(p=>p.rubric===r.name && p.status==='pub').length;
            return {...r, fact};
        });
    },[monthRubrics,monthPosts]);

    const monthRescheduleLogs = useMemo(()=>{
        return rescheduleLogs.filter(l=>{
            const d = new Date(l.timestamp);
            return d.getMonth()===month && d.getFullYear()===year;
        });
    },[rescheduleLogs,month,year]);
    const monthDeleteLogs = useMemo(()=>{
        return deleteLogs.filter(l=>{
            const d = new Date(l.timestamp);
            return d.getMonth()===month && d.getFullYear()===year;
        });
    },[deleteLogs,month,year]);

    const groupedRescLogs = useMemo(()=>{
        return monthRescheduleLogs.reduce((a,l)=>{
            (a[l.rubric] = a[l.rubric]||[]).push(l); return a;
        },{});
    },[monthRescheduleLogs]);
    const groupedDelLogs = useMemo(()=>{
        return monthDeleteLogs.reduce((a,l)=>{
            (a[l.rubric] = a[l.rubric]||[]).push(l); return a;
        },{});
    },[monthDeleteLogs]);

    const daysInMonth = new Date(year,month+1,0).getDate();
    let startDow = new Date(year,month,1).getDay();
    startDow = startDow===0 ? 6 : startDow-1;

    const isPrevDisabled = year===minDate.getFullYear() && month<=minDate.getMonth();
    const prevMonth = ()=>{ if(!isPrevDisabled){ setCurrentDate(new Date(year,month-1,1)); setActiveRubricFilter(null);} };
    const nextMonth = ()=>{ setCurrentDate(new Date(year,month+1,1)); setActiveRubricFilter(null); };

    const syncInstagramStatus = (savedPost) => {
        if(savedPost.social==='Instagram'){
            posts.forEach(p=>{
                if(p.social!=='Instagram' && p.desc.trim()===savedPost.desc && p.status!==savedPost.status){
                    db.ref(`shared_workspace/posts/${p.id}`).update({status:savedPost.status,updatedAt:Date.now()});
                }
            });
        }
    };

    const savePost = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const [y,m,d] = fd.get('date').split('-').map(Number);
        const desc = fd.get('desc').trim();
        let status = fd.get('status');
        const rubric = postRubricSearch;

        if(activeSocial!=='Instagram'){
            const insta = posts.find(p=>p.social==='Instagram' && p.desc.trim()===desc);
            if(insta) status = insta.status;
        }

        const newPost = {
            id: postModal.post?.id || db.ref().push().key,
            day:d, month:m-1, year:y, rubric, status, desc, social:activeSocial, updatedAt:Date.now()
        };

        const dateChanged = postModal.post?.id && (postModal.post.day!==d || postModal.post.month!==m-1 || postModal.post.year!==y);
        const grace = Number(settings.gracePeriodMinutes);
        const elapsed = postModal.post?.updatedAt ? (Date.now()-postModal.post.updatedAt)/60000 : Infinity;

        const finish = () => {
            db.ref(`shared_workspace/posts/${newPost.id}`).set(newPost);
            syncInstagramStatus(newPost);
            setPostModal({open:false,post:null,day:1});
            setPostRubricSearch('');
            toast(postModal.post?.id ? 'Изменения сохранены':'Пост создан');
        };

        if(dateChanged && settings.requireReason && elapsed>=grace){
            setReschedulePrompt({
                open:true,
                post:newPost,
                oldDate:fmtDate(postModal.post.day,postModal.post.month,postModal.post.year),
                newDate:fmtDate(d,m-1,y),
            });
            setPostModal({open:false,post:null,day:1});
        } else finish();
    };

    const deletePost = () => {
        if(!postModal.post?.id) return;
        const grace = Number(settings.deleteGracePeriodMinutes);
        const elapsed = postModal.post.updatedAt ? (Date.now()-postModal.post.updatedAt)/60000 : Infinity;
        if(settings.deleteRequireReason && elapsed>=grace){
            setDeletePrompt({open:true,post:postModal.post});
            setPostModal({open:false,post:null,day:1});
        } else {
            db.ref(`shared_workspace/posts/${postModal.post.id}`).remove();
            setPostModal({open:false,post:null,day:1});
            toast('Пост удалён');
        }
    };

    const confirmReschedule = (e) => {
        e.preventDefault();
        const reason = new FormData(e.target).get('reason').trim();
        if(!reason){ toast('Укажите причину',true); return; }
        db.ref(`shared_workspace/posts/${reschedulePrompt.post.id}`).set(reschedulePrompt.post);
        syncInstagramStatus(reschedulePrompt.post);
        const logId = db.ref().push().key;
        db.ref(`shared_workspace/rescheduleLogs/${logId}`).set({
            postId:reschedulePrompt.post.id, rubric:reschedulePrompt.post.rubric,
            desc:reschedulePrompt.post.desc, oldDate:reschedulePrompt.oldDate,
            newDate:reschedulePrompt.newDate, reason, author:user.displayName||user.email, timestamp:Date.now()
        });
        setReschedulePrompt({open:false,post:null,oldDate:'',newDate:''});
        toast('Перенос зафиксирован');
    };

    const confirmDelete = (e) => {
        e.preventDefault();
        const reason = new FormData(e.target).get('reason').trim();
        if(!reason){ toast('Укажите причину',true); return; }
        db.ref(`shared_workspace/posts/${deletePrompt.post.id}`).remove();
        const logId = db.ref().push().key;
        db.ref(`shared_workspace/deleteLogs/${logId}`).set({
            postId:deletePrompt.post.id, rubric:deletePrompt.post.rubric, desc:deletePrompt.post.desc,
            dateStr:fmtDate(deletePrompt.post.day,deletePrompt.post.month,deletePrompt.post.year),
            reason, author:user.displayName||user.email, timestamp:Date.now()
        });
        setDeletePrompt({open:false,post:null});
        toast('Пост удалён');
    };

    const saveSocial = () => {
        const name = newSocialName.trim();
        if(name && !socials.some(s=>s.name===name)){
            const k = db.ref().push().key;
            db.ref(`shared_workspace/socials/${k}`).set({name,year,month});
            setActiveSocial(name);
            toast('Площадка добавлена');
        }
        setAddingSocial(false); setNewSocialName('');
    };
    const deleteSocial = (id) => {
        db.ref(`shared_workspace/socials/${id}`).remove();
        toast('Площадка удалена');
    };

    const addAdmin = (e) => {
        e.preventDefault();
        if(newAdminEmail.trim()){
            const k = db.ref().push().key;
            db.ref(`shared_workspace/admins/${k}`).set({email:newAdminEmail.trim().toLowerCase()});
            setNewAdminEmail('');
            toast('Администратор добавлен');
        }
    };
    const removeAdmin = id => {
        db.ref(`shared_workspace/admins/${id}`).remove();
        toast('Администратор удалён');
    };
    const deleteLog = id => { db.ref(`shared_workspace/rescheduleLogs/${id}`).remove(); };
    const deleteDelLog = id => { db.ref(`shared_workspace/deleteLogs/${id}`).remove(); };

    const createBaseRubric = () => {
        const name = prompt('Название новой рубрики:');
        if(name && name.trim()){
            const k = db.ref().push().key;
            db.ref(`shared_workspace/rubricsBase/${k}`).set({name:name.trim(),status:'new',goal:'',audience:'',funnel:'',format:'',examples:'',freq:'',benefit:'',why:''});
            toast('Рубрика создана');
        }
    };
    const deleteBaseRubric = id => {
        if(confirm('Удалить рубрику из базы?')) db.ref(`shared_workspace/rubricsBase/${id}`).remove();
    };
    const updateBaseRubric = (id,f,v) => db.ref(`shared_workspace/rubricsBase/${id}/${f}`).set(v);

    const addRubricToMonth = (e) => {
        e.preventDefault();
        if(!rubricSearch.trim()) return;
        const fd = new FormData(e.target);
        const k = db.ref().push().key;
        db.ref(`shared_workspace/monthlyRubrics/${k}`).set({
            name:rubricSearch.trim(), plan:parseInt(fd.get('plan')), year, month, social:activeSocial
        });

        toast('Рубрика добавлена в план');
    };
    const removeRubricFromMonth = id => { db.ref(`shared_workspace/monthlyRubrics/${id}`).remove(); };
    const savePlan = (id,val) => {
        const p = parseInt(val);
        if(!isNaN(p) && p>0) db.ref(`shared_workspace/monthlyRubrics/${id}/plan`).set(p);
    };
    const copyPlan = (e) => {
        e.preventDefault();
        const target = new FormData(e.target).get('target');
        if(!target) return;
        const u = {};
        monthRubrics.forEach(r=>{
            const k = db.ref().push().key;
            const {id,...rest}=r; u[`monthlyRubrics/${k}`]={...rest,social:target};
        });
        monthPosts.forEach(p=>{
            const k = db.ref().push().key;
            const {id,...rest}=p; u[`posts/${k}`]={...rest,social:target};
        });
        db.ref('shared_workspace').update(u);
        setCopyModal(false);
        setActiveSocial(target);
        toast('План скопирован');
    };

    const onDragStart = (e,postId) => e.dataTransfer.setData('postId',postId);
    const onDrop = (e,day) => {
        e.preventDefault(); setDragOverDay(null);
        const postId = e.dataTransfer.getData('postId');
        if(!postId) return;
        const p = posts.find(x=>x.id===postId);
        if(!p || p.day===day) return;
        const grace = Number(settings.gracePeriodMinutes);
        const elapsed = p.updatedAt ? (Date.now()-p.updatedAt)/60000 : Infinity;
        const newPost = {...p, day, month, year, updatedAt:Date.now()};
        if(settings.requireReason && elapsed>=grace){
            setReschedulePrompt({
                open:true, post:newPost,
                oldDate:fmtDate(p.day,p.month,p.year),
                newDate:fmtDate(day,month,year),
            });
        } else {
            db.ref(`shared_workspace/posts/${newPost.id}`).set(newPost);
            toast('Пост перенесён');
        }
    };

    const statusOrder = {active:1,new:2,archived:3};
    const sortedRubricsBase = [...rubricsBase].sort((a,b)=>statusOrder[a.status]-statusOrder[b.status]);
    const availableBaseRubrics = rubricsBase.filter(r=>r.status!=='archived' && !monthRubrics.some(x=>x.name===r.name));
    const filteredModalRubrics = availableBaseRubrics.filter(r=>r.name.toLowerCase().includes(rubricSearch.toLowerCase()));
    const filteredPostRubrics = monthRubrics.filter(r=>r.name.toLowerCase().includes(postRubricSearch.toLowerCase()));

    if(authLoading) return <div className="loader-wrap"><div className="loader"/></div>;

    if(!user){

                    <button className="btn pri" style={{width:'100%',justifyContent:'center'}} onClick={login}>

                    </button>
                </div>
            </div>

    if(accessDenied){
        return (
            <div className="loader-wrap">

                                                                <i className="fas fa-plus"/>
                                                            </button>
                                                        )}
                                                    </div>
                                                    {dayPosts.map(p=>{

                                                        return (

                                                                onClick={e=>{e.stopPropagation();setPostModal({open:true,post:p,day:p.day});}}>
                                                                <div className="pc-rubric">{p.rubric}</div>
                                                                <div className="pc-desc">{p.desc}</div>
                                                                <i className={'fas '+STATUSES[p.status].icon+' pc-ico'} style={{color:STATUSES[p.status].color}}/>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>

                            <div className="panel">
                                <h3>
                                    <span style={{display:'flex',alignItems:'center',gap:8}}>
                                        План рубрик <small style={{font:'500 11px Golos Text'}}>{activeSocial}</small>
                                    </span>
                                    <button className="btn mini ghost" onClick={()=>setRubricModal(true)} style={{padding:'0 10px'}}>
                                        <i className="fas fa-plus" style={{fontSize:10}}/>
                                    </button>
                                </h3>

                                {monthRubrics.length===0 ? (
                                    <div className="empty" style={{marginTop:20}}>
                                        <i className="far fa-list-alt"/>
                                        <b>Пока нет рубрик</b>
                                        <p>Добавьте рубрики в план на {MONTH_NAMES[month]} для площадки <b>{activeSocial}</b>.</p>
                                    </div>
                                ) : (
                                    <div className="rubric-list">
                                        {rubricStats.map(r=>{
                                            const pct = Math.min(r.fact/r.plan*100,100);
                                            const complete = r.fact>=r.plan;
                                            const active = activeRubricFilter===r.name;
                                            return (
                                                <RubricItem key={r.id}
                                                    r={r}
                                                    pct={pct}
                                                    complete={complete}
                                                    active={active}
                                                    onClick={()=>setActiveRubricFilter(active?null:r.name)}
                                                    onEditPlan={id=>setPostModal({open:true,post:null,day:1,preRubric:r.name})}
                                                    onDelete={()=>removeRubricFromMonth(r.id)}
                                                    onSavePlan={savePlan}
                                                />
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>
                    </>
                )}

                {activeTab==='rubrics' && (
                    <div className="tbl-wrap">

                                <h3>Глобальная база рубрик</h3>

                        <div style={{overflowX:'auto'}}>

                                        <th>Польза</th>
                                        <th>Почему сработает</th>
                                        <th style={{width:40}}/>

                                <tbody>
                                    {sortedRubricsBase.map((r,i)=>(

                                            <td><div className="cell" contentEditable suppressContentEditableWarning onBlur={e=>updateBaseRubric(r.id,'name',e.target.innerText)}>{r.name}</div></td>

                                                <select value={r.status} onChange={e=>updateBaseRubric(r.id,'status',e.target.value)}>

                                                    <option value="new">Новая</option>

                                            <td><div className="cell" contentEditable suppressContentEditableWarning onBlur={e=>updateBaseRubric(r.id,'audience',e.target.innerText)}>{r.audience}</div></td>

                <div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget)setPostModal({open:false,post:null,day:1});}}>
                    <div className="modal">
                        <h3>{postModal.post?.id?'Редактировать публикацию':'Новая публикация'}</h3>
                        <div className="sub">{activeSocial} · {MONTH_NAMES[month]} {year}</div>
                        <form className="f" onSubmit={savePost}>
                            <label>Тема / описание</label>
                            <input type="text" name="desc" required autoFocus defaultValue={postModal.post?.desc||''} placeholder="О чём пост?"/>

                            <div className="frow">
                                <div>
                                    <label>Дата</label>
                                    <input type="date" name="date" required defaultValue={defaultPostDate}/>
                                </div>
                                <div>
                                    <label>Статус</label>
                                    <select name="status" defaultValue={postModal.post?.status||'plan'}>
                                        <option value="plan">Запланировано</option>
                                        <option value="proc">В производстве</option>
                                        <option value="ready">Ожидает</option>
                                        <option value="pub">Опубликовано</option>
                                    </select>
                                </div>
                            </div>

                            <label>Рубрика</label>
                            <Dropdown
                                value={postRubricSearch}
                                onChange={setPostRubricSearch}
                                options={monthRubrics.map(r=>r.name)}
                                placeholder="Начните вводить рубрику…"
                                emptyLabel={monthRubrics.length===0?'Сначала добавьте рубрики в план':'Не найдено'}
                            />
                            <input type="hidden" name="rubric" value={postRubricSearch}/>

                            <div className="mfoot">
                                {postModal.post?.id && <button type="button" className="btn danger" onClick={deletePost}><i className="far fa-trash-alt"/>Удалить</button>}
                                <span style={{flex:1}}/>
                                <button type="button" className="btn ghost" onClick={()=>{setPostModal({open:false,post:null,day:1});setPostRubricSearch('');}}>Отмена</button>
                                <button type="submit" className="btn pri" disabled={!postRubricSearch.trim() || !monthRubrics.some(r=>r.name===postRubricSearch.trim())}>
                                    {postModal.post?.id?'Сохранить':'Создать'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            )}

            {rubricModal && (
                <div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget){setRubricModal(false);setRubricSearch('');}}}>
                    <div className="modal">
                        <h3>Добавить рубрику на {MONTH_NAMES[month]}</h3>
                        <div className="sub">{activeSocial} · {year}</div>
                        <form className="f" onSubmit={addRubricToMonth}>
                            <label>Рубрика</label>
                            <Dropdown
                                value={rubricSearch}
                                onChange={setRubricSearch}
                                options={filteredModalRubrics.map(r=>r.name)}
                                placeholder="Выберите из базы…"
                                emptyLabel="Все рубрики уже в плане"
                            />
                            <p style={{fontSize:11,color:'var(--mut)',marginTop:6}}>
                                Доступно: {filteredModalRubrics.length} из {availableBaseRubrics.length}
                            </p>

                            <label>План постов на месяц</label>
                            <input type="number" name="plan" min="1" defaultValue="4" required/>

                            <div className="mfoot">
                                <button type="button" className="btn ghost" onClick={()=>{setRubricModal(false);setRubricSearch('');}}>Отмена</button>
                                <button type="submit" className="btn pri" disabled={!rubricSearch.trim() || !availableBaseRubrics.some(r=>r.name===rubricSearch.trim())}>Добавить в план</button>
                            </div>
                        </form>
                    </div>
                </div>
            )}

            {copyModal && (
                <div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget)setCopyModal(false);}}>
                    <div className="modal">
                        <h3>Скопировать план</h3>
                        <div className="sub">{activeSocial} · {MONTH_NAMES[month]} {year} → другая площадка</div>
                        <form className="f" onSubmit={copyPlan}>
                            <label>Целевая площадка</label>
                            <select name="target" required defaultValue="">
                                <option value="" disabled>Выберите площадку…</option>
                                {visibleSocials.filter(s=>s.name!==activeSocial).map(s=><option key={s.id} value={s.name}>{s.name}</option>)}
                            </select>
                            <div className="mfoot">
                                <button type="button" className="btn ghost" onClick={()=>setCopyModal(false)}>Отмена</button>
                                <button type="submit" className="btn pri" disabled={visibleSocials.length<2}>Скопировать</button>
                            </div>
                        </form>
                    </div>
                </div>
            )}

            {reschedulePrompt.open && (
                <div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget)setReschedulePrompt({open:false,post:null,oldDate:'',newDate:''});}}>
                    <div className="modal">
                        <h3 style={{display:'flex',alignItems:'center',gap:10}}>
                            <i className="fas fa-exclamation-triangle" style={{color:'var(--red)'}}/>
                            Перенос публикации
                        </h3>
                        <div className="sub">Пост «{reschedulePrompt.post?.desc || 'Без названия'}»</div>
                        <div className="date-diff">
                            <span className="old">{reschedulePrompt.oldDate}</span>
                            <span className="arr"><i className="fas fa-arrow-right"/></span>
                            <span className="new">{reschedulePrompt.newDate}</span>
                        </div>
                        <form className="f" onSubmit={confirmReschedule}>
                            <div className="warn-banner">
                                <i className="fas fa-info-circle"/>
                                <span>Укажите причину переноса — это поможет анализировать сбои в контент-плане.</span>
                            </div>
                            <label>Причина</label>
                            <textarea name="reason" rows="3" required placeholder="Например: не готов креатив, перенесли запуск продукта…"/>
                            <div className="mfoot">
                                <button type="button" className="btn ghost" onClick={()=>setReschedulePrompt({open:false,post:null,oldDate:'',newDate:''})}>Отмена</button>
                                <button type="submit" className="btn pri" style={{background:'var(--red)'}}>Подтвердить перенос</button>
                            </div>
                        </form>
                    </div>
                </div>
            )}

            {deletePrompt.open && (
                <div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget)setDeletePrompt({open:false,post:null});}}>
                    <div className="modal">
                        <h3 style={{display:'flex',alignItems:'center',gap:10}}>
                            <i className="fas fa-trash-alt" style={{color:'var(--red)'}}/>
                            Удаление публикации
                        </h3>
                        <div className="sub">«{deletePrompt.post?.desc}»</div>
                        <form className="f" onSubmit={confirmDelete}>
                            <div className="warn-banner">
                                <i className="fas fa-info-circle"/>
                                <span>Укажите причину удаления поста из плана.</span>
                            </div>
                            <label>Причина</label>
                            <textarea name="reason" rows="3" required placeholder="Например: тема потеряла актуальность…"/>
                            <div className="mfoot">
                                <button type="button" className="btn ghost" onClick={()=>setDeletePrompt({open:false,post:null})}>Отмена</button>
                                <button type="submit" className="btn pri" style={{background:'var(--red)'}}>Удалить навсегда</button>
                            </div>
                        </form>
                    </div>
                </div>
            )}

            <div className="toasts">
                {toasts.map(t=>(
                    <div key={t.id} className={'toast'+(t.err?' err':'')}>
                        <span className="tdot"/>{t.msg}
                    </div>
                ))}
            </div>
        </div>
    );
}

function Ring({pct,size=60}){
    const r = (size-9)/2, c = 2*Math.PI*r;
    return (
        <svg width={size} height={size}>
            <circle cx={size/2} cy={size/2} r={r} stroke="#E5E9DC" strokeWidth="7" fill="none"/>
            <circle cx={size/2} cy={size/2} r={r} stroke="#0FA36B" strokeWidth="7" fill="none"
                strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c*(1-pct)}
                transform={`rotate(-90 ${size/2} ${size/2})`} style={{transition:'stroke-dashoffset .8s ease'}}/>
            <text x="50%" y="54%" dominantBaseline="middle" textAnchor="middle"
                style={{font:"700 12px 'Unbounded'",fill:'#141B17'}}>{Math.round(pct*100)}%</text>
        </svg>
    );
}

function RubricItem({r,pct,complete,active,onClick,onEditPlan,onDelete,onSavePlan}){
    const [editing,setEditing] = useState(false);
    const [val,setVal] = useState(r.plan);
    const finish = () => { onSavePlan(r.id,val); setEditing(false); };
    return (
        <div className={'rubric-item'+(active?' on':'')} onClick={onClick}>
            <div className="ri-top">
                <div className="ri-name">{r.name}</div>
                <div className={'ri-count'+(complete?' complete':'')} onClick={e=>{e.stopPropagation();if(!editing){setEditing(true);setVal(r.plan);}}}>
                    {editing ? (
                        <input type="number" autoFocus min="1" value={val} onChange={e=>setVal(e.target.value)} onBlur={finish} onKeyDown={e=>{if(e.key==='Enter')finish();if(e.key==='Escape')setEditing(false);}}/>
                    ) : (
                        <>{r.fact} / {r.plan}</>
                    )}
                </div>
            </div>
            <div className={'ri-track'+(complete?' complete':'')}>
                <i style={{width:pct+'%'}}/>
            </div>
            {active && (
                <div className="ri-actions" onClick={e=>e.stopPropagation()}>
                    <button className="btn danger mini" onClick={onDelete}>
                        <i className="far fa-trash-alt" style={{fontSize:10}}/>Убрать
                    </button>
                    <button className="btn pri mini" onClick={()=>onEditPlan(r.id)} style={{flex:1,justifyContent:'center'}}>
                        <i className="fas fa-plus" style={{fontSize:10}}/>Пост по рубрике
                    </button>
                </div>
            )}
        </div>
    );
}

function Dropdown({value,onChange,options,placeholder,emptyLabel}){
    const [open,setOpen] = useState(false);
    const ref = useRef(null);
    useEffect(()=>{
        const h = e => { if(ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown',h);
        return ()=>document.removeEventListener('mousedown',h);
    },[]);
    const filtered = options.filter(o=>o.toLowerCase().includes(value.toLowerCase()));
    return (
        <div className="dd" ref={ref}>
            <input
                type="text"
                value={value}
                placeholder={placeholder}
                onChange={e=>{onChange(e.target.value);setOpen(true);}}
                onFocus={()=>setOpen(true)}
            />
            {open && (
                <div className="dd-list">
                    {filtered.length===0 ? (
                        <div className="dd-empty">{emptyLabel||'Ничего не найдено'}</div>
                    ) : filtered.map(o=>(
                        <div key={o} className="dd-item" onMouseDown={e=>{e.preventDefault();onChange(o);setOpen(false);}}>
                            {o}
                        </div>
                    ))}
                </div>
            )}
        </div>
    );
}

function LogsSection({title,icon,color,logs,total,collapsed,toggle,onDelete,type}){
    const keys = Object.keys(logs);
    return (
        <div className="panel">
            <div className="logs-head">
                <h4 style={{color}}><i className={'fas '+icon} style={{color}}/>{title}</h4>
                <span className="cnt-badge">Всего: {total}</span>
            </div>
            {keys.length===0 ? (
                <div className="empty">
                    <i className={'fas '+(type==='del'?'fa-check-circle':'fa-calendar-check')}/>
                    <p>{type==='del'?'Удалений в этом месяце не было':'Переносов дат в этом месяце не было'}</p>
                </div>
            ) : (
                <div style={{maxHeight:'calc(100vh - 420px)',overflowY:'auto',paddingRight:4}}>
                    {keys.map(rubric=>{
                        const items = logs[rubric].sort((a,b)=>b.timestamp-a.timestamp);
                        const col = collapsed[rubric];
                        const isRed = type==='del';
                        return (
                            <div key={rubric} className={'log-group'+(isRed?' red':'')}>
                                <div className="log-group-head" onClick={()=>toggle(rubric)}>
                                    <i className={'fas fa-chevron-'+(col?'right':'down')}/>
                                    <b>{rubric}</b>
                                    <span style={{fontSize:11,color:'var(--mut)'}}>{items.length} шт.</span>
                                </div>
                                {!col && items.map((log,i)=>(
                                    <div key={log.id||i} className="log-entry">
                                        <div className="log-meta">
                                            <div className="log-desc"><i className="far fa-file-alt" style={{marginRight:6,color:'var(--mut)'}}/>{log.desc||'Без описания'}</div>
                                            <div className="log-dates">
                                                {type==='resc' ? (
                                                    <>
                                                        <span className="old">{log.oldDate}</span>
                                                        <i className="fas fa-arrow-right" style={{color:'var(--mut)'}}/>
                                                        <span className="new">{log.newDate}</span>
                                                    </>
                                                ) : (
                                                    <><i className="far fa-calendar-times" style={{color:'var(--red)'}}/>{log.dateStr}</>
                                                )}
                                            </div>
                                        </div>
                                        <div className="reason">«{log.reason}»</div>
                                        <div className="foot">
                                            <span><i className="far fa-user" style={{marginRight:4}}/>{log.author}</span>
                                            <span><i className="far fa-clock" style={{marginRight:4}}/>{new Date(log.timestamp).toLocaleString('ru-RU')}</span>
                                        </div>
                                        <button className="del-btn" onClick={()=>onDelete(log.id)} title="Удалить лог"><i className="far fa-trash-alt"/></button>
                                    </div>
                                ))}
                            </div>
                        );
                    })}
                </div>
            )}
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
